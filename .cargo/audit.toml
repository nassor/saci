# cargo audit policy. `cargo audit` exits nonzero on any unignored advisory.

# RUSTSEC-2026-0258 (h2 0.3.27), RUSTSEC-2024-0437 (protobuf 2.28.0), and
# RUSTSEC-2026-0098, RUSTSEC-2026-0099, RUSTSEC-2026-0104 (rustls-webpki
# 0.101.7) affect the legacy transitive stack pinned by tikv-client 0.4.0 and
# raft 0.7.0, both at their latest releases.
#
# This workspace cannot upgrade them away: tikv-client 0.4.0 and raft 0.7.0
# pin tonic 0.10, which requires h2 0.3 (EOL, no further patches) and the
# rustls 0.21 line (rustls-webpki 0.101.7); raft-proto 0.7.0 requires protobuf
# 2.x non-optionally. No newer release of tikv-client, raft, or raft-proto
# exists that lifts these pins.
#
# Reachability is limited: saci-connectors talks to TiKV only via the
# operator-configured endpoint of TikvSharedStore/TikvStateClient, and the raft
# dev-dependency exchanges messages only with cluster peers, not unauthenticated
# input.
#
# Remove these entries when tikv-client or raft-rs publishes a release on
# tonic >=0.11 / rustls >=0.23 / protobuf >=3, then run `cargo update` and
# re-verify `cargo audit`.
[advisories]
ignore = [
    "RUSTSEC-2026-0258",
    "RUSTSEC-2024-0437",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]
