[package]
name = "windowing-session-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A sample processor component, not a library a downstream consumer would
# depend on.
publish = false
description = "Windowing session demo processor component: merges two NATS streams into gap-delimited sessions and emits per-session totals."

# A processor pipeline component, NOT a binary. `cargo build --target wasm32-wasip2`
# links the cdylib straight into a Component Model component exporting the
# saci-pipeline world from saci-processor's WIT package.
[lib]
crate-type = ["cdylib"]

[dependencies]
# No `windows` feature: a session's bounds are data, so this processor carries
# its own cross-batch merge instead of `saci_core::windows`.
saci-processor = { workspace = true }
serde = { workspace = true }
# Traces the nested state component's Arrow schema from a sample, so it matches
# serde_arrow's encoding exactly.
serde_arrow = { workspace = true }

# The bindings generator. Gated on wasm32 because `src/lib.rs` gates the
# generated module the same way: the host build of this crate is an empty cdylib
# and has no use for the generator or its proc-macro dependency tree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }
