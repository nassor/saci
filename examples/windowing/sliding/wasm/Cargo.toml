[package]
name = "windowing-sliding-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A sample processor component, not a library a downstream consumer would
# depend on.
publish = false
description = "Windowing sliding demo processor component: merges two NATS streams into overlapping sliding windows and emits per-window totals."

# A processor pipeline component, NOT a binary. `cargo build --target wasm32-wasip3`
# links the cdylib straight into a Component Model component exporting the
# saci-pipeline world from the WIT package of the `saci` crate.
[lib]
crate-type = ["cdylib"]

[dependencies]
saci = { workspace = true, features = ["processor"] }
serde = { workspace = true }
# Traces the nested state component's Arrow schema from a sample, so it matches
# serde_arrow's encoding exactly.
serde_arrow = { workspace = true }

# The bindings generator, invoked by the `#[processor]` expansion. Gated on wasm32
# because that expansion is: the host build of this crate is an empty cdylib
# and has no use for the generator or its proc-macro dependency tree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }
