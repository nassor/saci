# The two containers the Quick Start needs: NATS as the publisher's ingest
# transport into saci-service, and PostgreSQL as the destination.
#
# Images track the ones the connector test suites already exercise through
# testcontainers (nats:2.11-alpine, postgres:18-alpine), so what the tutorial
# runs is what CI runs.
#
#   docker compose -f examples/quickstart/docker-compose.yml up -d
#   docker compose -f examples/quickstart/docker-compose.yml down -v
services:
  nats:
    image: nats:2.11-alpine
    # -js enables JetStream. The Quick Start uses core subjects, which need no
    # flag, but leaving JetStream on means switching a config to
    # `kind = "jetstream"` needs no compose change.
    command: ["-js"]
    ports:
      - "4222:4222"
    healthcheck:
      # The monitoring port answers before the client port accepts, so the probe
      # uses the client port through the image's own nats-server binary.
      test: ["CMD", "sh", "-c", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: saci
      POSTGRES_DB: saci
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL runs every .sql in this directory once, on first
      # initialisation of an empty data directory. `PostgresSink` never issues
      # CREATE TABLE, so the table has to exist before the sink's first write.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saci"]
      interval: 2s
      timeout: 3s
      retries: 15
