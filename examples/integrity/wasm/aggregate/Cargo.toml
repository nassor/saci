[package]
name = "integrity-aggregate-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A sample processor component, not a library a downstream consumer would
# depend on.
publish = false
description = "Integrity demo processor component: merges classified orders and NATS payments into tumbling per-region windows."

# A processor pipeline component, NOT a binary. `cargo build --target wasm32-wasip2`
# links the cdylib straight into a Component Model component exporting the
# saci-pipeline world from saci-processor's WIT package.
[lib]
crate-type = ["cdylib"]

[dependencies]
saci-processor = { workspace = true, features = ["windows"] }
serde = { workspace = true }
# Traces the nested window state component's Arrow schema from a sample, so it
# matches serde_arrow's encoding exactly.
serde_arrow = { workspace = true }

# The bindings generator. Gated on wasm32 because `src/lib.rs` gates the
# generated module the same way: the host build of this crate is an empty cdylib
# and has no use for the generator or its proc-macro dependency tree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }
