# The three containers the integrity example needs: Kafka carries the orders,
# NATS JetStream carries the payments, and PostgreSQL holds the audit table the
# CDC source decodes.
#
# Images track the ones the connector test suites already exercise through
# testcontainers (apache/kafka:3.9.0, nats:2.11-alpine, postgres:18-alpine), so
# what the example runs is what CI runs.
#
#   docker compose -f examples/integrity/docker-compose.yml up -d
#   docker compose -f examples/integrity/docker-compose.yml down -v
services:
  nats:
    image: nats:2.11-alpine
    # -js enables JetStream. The example publishes payments into the INTEGRITY
    # stream, so this flag is required, not a convenience: a paused `settle`
    # workflow must lose nothing, which only a durable consumer gives.
    command: ["-js"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:3.9.0
    # KRaft, single node: the broker is its own controller, so there is no
    # ZooKeeper container. Auto topic creation is on so the publisher's first
    # produce creates `integrity.orders` without an admin round trip.
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://127.0.0.1:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: saci
      POSTGRES_DB: saci
    # `cdc_logical` decodes pgoutput through the SQL slot interface, which
    # needs wal_level = logical and a replication slot. No walsender process is
    # involved, so max_wal_senders is left alone. The default `postgres` role
    # is a superuser, which covers the REPLICATION attribute the slot needs.
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=8"
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL runs every .sql in this directory once, on first
      # initialisation of an empty data directory. The connector creates its
      # replication slot but never a publication, so schema.sql has to run
      # before the audit service starts.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saci"]
      interval: 2s
      timeout: 3s
      retries: 15
