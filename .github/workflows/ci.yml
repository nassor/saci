name: CI

on:
  push:
      branches: [ "main" ]
  pull_request:
      branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    # The job builds six feature configurations into one target directory
    # plus the Docker images its suites pull, which outgrows the runner's free
    # disk. Dropping preinstalled toolchains this workspace never uses frees
    # about 25 GB.
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h /

    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0  # Rust minimum version
        components: rustfmt, clippy

    # The kafka connector vendors librdkafka via rdkafka-sys's `cmake-build`
    # feature, and it compiles in every job that builds a saci test or
    # example target, because saci's dev-dependencies include rdkafka; the
    # distributed_chaos, mariadb_servers, wasm_processor and plugins_and_quickstart jobs
    # install this same package. That build is configured with
    # -DWITH_CURL=0, but the config.h cmake generates for POSIX targets uses
    # `#cmakedefine01 WITH_OAUTHBEARER_OIDC`, which defines the macro as 0
    # rather than leaving it undefined, and rdkafka_conf.c gates its
    # `#include <curl/curl.h>` on `#ifdef WITH_OAUTHBEARER_OIDC`. The header is
    # therefore compiled even with curl support off, so the --all-features
    # clippy build needs libcurl's development headers present. Nothing links
    # against libcurl; only the include has to resolve.
    - name: Install librdkafka build prerequisites
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    # The processor components generate their WIT bindings in-macro, so nothing
    # has to be produced on disk before `cargo fmt`. The one wasm build this job
    # still needs is the smoketest artifact, which `tests/wasm_roundtrip.rs`
    # hard-asserts exists.
    - name: Install wasm32-wasip3 target
      run: rustup target add wasm32-wasip3

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.143

    - name: Build smoketest WASM component
      run: cargo build --release -p saci-processor-smoketest --target wasm32-wasip3

    - name: Check formatting
      run: cargo fmt -q --all -- --check

    - name: Run clippy
      run: cargo clippy -q --all-targets --all-features -- -D warnings

    # The `server` bundle carries only the connectors that need nothing
    # installed or already running, so a reduced feature combination is a
    # normal way to build this binary rather than an edge case. The
    # --all-features gate above cannot see an item that is dead only when a
    # feature is off: every `#[cfg]`-sensitive const, function and binding is
    # reachable there. This step builds the narrowest runnable service and
    # fails on the warning that build emits.
    - name: Clippy, reduced build
      run: cargo clippy -q -p saci --no-default-features --features service --all-targets -- -D warnings

    # The same feature set plus the channel connector the service unit tests
    # drive, run rather than linted. It carries neither processor host and no
    # windowing engine, so it is the only step where
    # `test_wasm_node_without_the_host_parses_and_names_the_feature`
    # (`#[cfg(not(feature = "wasm-host"))]`, and every other test rung in this
    # job has `wasm-host`) and
    # `test_a_missing_host_is_named_before_a_missing_windowing_engine`
    # (`#[cfg(all(not(feature = "wasm-host"), not(feature = "windows")))]`) are
    # compiled at all. The two other refusal tests this build runs,
    # `test_plugin_node_without_the_host_parses_and_names_the_feature` and
    # `test_cluster_mode_without_the_raft_stack_names_the_feature`, are not
    # exclusive to it: neither `plugin-host` nor `service-cluster` is in the
    # `server` bundle, so the server-bundle step below runs both too. This
    # build is also the only one carrying no codec and one connector,
    # so it is where a missing-format or missing-factory message is produced
    # by the real call path instead of by a direct call.
    # `--lib` on purpose: the integration tests under `tests/` need
    # connectors or a wasm host this feature set deliberately excludes. Do
    # not fold this into the clippy step above; clippy proves the reduced
    # build compiles, not that it works.
    - name: Test, reduced build
      run: cargo nextest run -p saci --no-default-features --features service,connector-channel --lib

    # Both processor hosts with no windowing engine, which is the only
    # configuration in which a `window` block can be declared on a node this
    # build can host and still find no engine to serve it. Three refusal tests
    # are gated on exactly that and run nowhere else in this job:
    # `service::config::tests::test_window_block_without_the_engine_parses_and_names_the_feature`
    # and
    # `service::config::tests::test_plugin_window_block_without_the_engine_names_the_feature`
    # (`#[cfg(all(not(feature = "windows"), feature = "wasm-host"))]` and the
    # `plugin-host` counterpart), and
    # `service::builder::tests::test_a_window_block_without_the_engine_is_refused_by_the_builder`,
    # the embedder-facing half. No neighbouring rung reaches the combination:
    # the reduced build above carries neither host, so the block has no node
    # to sit on; the `server` bundle below and the `--all-features` suite
    # both carry `windows`, so there is nothing to refuse. Without this step
    # the three compile in no CI configuration, and a refusal that names the
    # wrong feature, or stops naming one, goes unnoticed.
    - name: Test, host pair without the windowing engine
      run: cargo nextest run -p saci --no-default-features --features service,wasm-host,plugin-host,connector-channel --lib

    # The library default, which is what a crate depending on `saci` with no
    # feature named gets: the engine alone.
    - name: Test, library default
      run: cargo nextest run --workspace --lib

    # The `server` bundle, which is what `cargo install saci --features
    # server` produces. It registers 12 of the 28 connector type names in
    # `BUILTIN_CONNECTOR_FEATURES` (the channel, file, HTTP, TCP, UDP, peer
    # and redb connectors), a partial set neither neighbouring step reaches:
    # the reduced build above registers only the channel connector, the
    # `--all-features` suite below all of them. A premise that holds at one
    # connector and again at twenty-eight can still be false in between, and
    # this is the only step in between.
    # `service::topology::tests::every_allowlist_key_is_a_connector_type_this_crate_ships`
    # is the allowlist check that meets the partial registry here. The feature
    # space is partial too: `RUNTIME_SOURCE_HELP`'s `wasm-host`-without-
    # `plugin-host` arm in `service/builder.rs` is compiled by no other test
    # run in this job, since the reduced build has neither host and
    # `--all-features` has both.
    # `--lib` and not every target: the `--all-features` suite below builds
    # every integration target, so nothing goes uncovered.
    - name: Test, server bundle
      run: cargo nextest run -p saci --features server --lib

    - name: Build
      run: cargo build -q

    - name: Check benchmarks
      run: cargo check -q --benches

    # `--all-features` so the connector-gated example targets are compiled
    # too: an example naming `required-features = ["connector-nats"]` is
    # silently skipped by a default-feature check, because every connector
    # that needs an installed broker, database or object store is opt-in.
    - name: Check examples
      run: cargo check -q --examples --all-features

    # Registry pass builds and runs the runnable example configs
    # (examples.rs). Config-only pass then parses every examples/configs/*.kdl file
    # through every built-in connector's factory with `--all-features`,
    # which is why this job's librdkafka prerequisite above has to run
    # before this step.
    - name: Validate example configs
      run: cargo xtask validate

    # `ci` profile: the full suite, including the Docker-backed
    # connector/chaos tests the `default` profile skips for everyday local
    # runs. The one #[ignore]d test (a ~70-100s chaos run) is deliberately
    # excluded here; it runs alone in the `distributed_chaos` job below. See
    # .config/nextest.toml for what each profile covers.
    - name: Run tests
      run: cargo nextest run --workspace --all-features --profile ci

    - name: Run doctests
      run: cargo test -q --workspace --all-features --doc

    # Last in this job, and in this job rather than its own: `cargo doc`
    # needs the same `--all-features` dependency graph every step above has
    # already built into the cached `target`, so it costs one rustdoc pass per
    # workspace member here, against a cold cache plus the librdkafka
    # prerequisite in a job of its own. It runs after the test signal on
    # purpose: a documentation defect should not delay the report of a broken
    # test. Scope is the public items of workspace members under
    # `--all-features`; it does not reach `#[cfg(test)]` modules, which
    # rustdoc never documents, the non-member `saci-service-ui`, or doctest
    # execution, which is the step above.
    - name: Check rustdoc
      run: RUSTDOCFLAGS="-D warnings" cargo doc -q --workspace --all-features --no-deps

  distributed_chaos:
    name: Distributed Chaos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0  # Rust minimum version

    # saci's dev-dependencies pull in rdkafka, whose
    # rdkafka-sys cmake build compiles rdkafka_conf.c's `#include
    # <curl/curl.h>` on POSIX even with `-DWITH_CURL=0`; see
    # .agents/skills/saci-connectors/SKILL.md.
    - name: Install librdkafka build prerequisites
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-distributed-chaos-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.143

    # One of two #[ignore]d tests in crates/: a five-node Raft cluster behind
    # Toxiproxy, chaos-injecting latency/bandwidth/reset-peer/partition
    # faults for ~70-100s. Isolated in its own job so its runtime never sits
    # on the `test` job's critical path. `--test` scopes discovery to this
    # one binary so `--run-ignored ignored-only` can't pick up the other
    # unrelated `#[ignore]`d tests: `saci`'s lib unit test
    # `test_second_init_returns_error` (a global-tracing-subscriber race) and
    # the connector matrix's slices, run by the `connector_matrix` jobs below.
    - name: Full-stack distributed chaos test
      run: cargo nextest run -p saci --features distributed-raft --test distributed_integration_chaos --run-ignored ignored-only

  # The `test` job's `--profile ci` run already drives every
  # MariaDB connector suite against the harness defaults (mariadb:11.8
  # and mysql:8.4). This job runs the same suites once per older or newer
  # server release: `SACI_MARIADB_TEST_ONLY` skips the other flavour's cases,
  # and the image variable of the flavour under test names the release. It
  # selects the connector's own binaries and unit tests with a filter.
  mariadb_servers:
    name: MariaDB servers (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - only: mariadb
          image: "mariadb:10.11"
        - only: mariadb
          image: "mariadb:11.4"
        - only: mysql
          image: "mysql:9"
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0  # Rust minimum version

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-mariadb-servers-${{ hashFiles('**/Cargo.lock') }}

    # saci's dev-dependencies pull in rdkafka, whose rdkafka-sys cmake build
    # compiles rdkafka_conf.c's `#include <curl/curl.h>` on POSIX even with
    # `-DWITH_CURL=0`; see .agents/skills/saci-connectors/SKILL.md.
    - name: Install librdkafka build prerequisites
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.143

    # Only the flavour under test gets an image variable: the harness reads
    # an empty one as a value, not as unset.
    - name: MariaDB connector suites, ${{ matrix.image }}
      env:
        SACI_MARIADB_TEST_ONLY: ${{ matrix.only }}
        SERVER_IMAGE: ${{ matrix.image }}
      run: |
        if [ "$SACI_MARIADB_TEST_ONLY" = mariadb ]; then
          export SACI_MARIADB_TEST_MARIADB_IMAGE="$SERVER_IMAGE"
        else
          export SACI_MARIADB_TEST_MYSQL_IMAGE="$SERVER_IMAGE"
        fi
        cargo nextest run -p saci --features connector-mariadb --profile ci -E 'binary(/^mariadb_/) or test(/^connector::mariadb::/)'

  # The connector matrix is one test per {source, processor, format} slice
  # (`crates/saci/tests/connector_matrix.rs`). This job compiles them
  # once into a nextest archive, which also carries both processor fixtures
  # (`archive.include` in .config/nextest.toml), and lists the slice groups:
  # one per source connector, plus `maximal` for the maximal workflow.
  connector_matrix_build:
    name: Connector Matrix (build)
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0  # Rust minimum version

    # saci's dev-dependencies pull in rdkafka, whose
    # rdkafka-sys cmake build compiles rdkafka_conf.c's `#include
    # <curl/curl.h>` on POSIX even with `-DWITH_CURL=0`; see
    # .agents/skills/saci-connectors/SKILL.md.
    - name: Install librdkafka build prerequisites
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-connector-matrix-${{ hashFiles('**/Cargo.lock') }}

    - name: Install wasm32-wasip3 target
      run: rustup target add wasm32-wasip3

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.143

    - name: Build smoketest WASM component
      run: cargo build --release -p saci-processor-smoketest --target wasm32-wasip3

    - name: Build smoketest native plugin
      run: cargo build -p saci-plugin-smoketest

    - name: Archive the matrix
      run: cargo nextest archive -p saci --all-features --profile matrix --test connector_matrix --archive-file connector-matrix.tar.zst

    # Test names are `live::<group>::...`, so the second path segment of
    # every test the `matrix` profile selects is its group. A connector added
    # to the matrix gets its job here with no edit to this file.
    - name: List the slice groups
      id: groups
      run: |
        groups=$(cargo nextest list --archive-file connector-matrix.tar.zst --profile matrix --run-ignored all --message-format json \
          | jq -c '[.["rust-suites"][].testcases | to_entries[] | select(.value["filter-match"].status == "matches") | .key | split("::")[1]] | unique')
        echo "groups=$groups" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v5
      with:
        name: connector-matrix
        path: connector-matrix.tar.zst
        retention-days: 1

  # One job per group, all from the same archive, so nothing here compiles
  # but the xtask runner. `cargo xtask matrix` starts the seven containers
  # (Kafka, NATS, PostgreSQL, RustFS, ClickHouse, MariaDB, MySQL) the
  # group's slices share,
  # and nextest runs those slices in parallel against them.
  connector_matrix:
    name: Connector Matrix (${{ matrix.group }})
    needs: connector_matrix_build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.connector_matrix_build.outputs.groups) }}
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0  # Rust minimum version

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@0.9.143

    - uses: actions/download-artifact@v5
      with:
        name: connector-matrix

    - name: Connector matrix, ${{ matrix.group }}
      run: cargo xtask matrix --archive-file connector-matrix.tar.zst -E 'test(/^live::${{ matrix.group }}::/)'

  wasm_processor:
    name: WASM Processor (wasm32-wasip3)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0  # Rust minimum version

    # saci's dev-dependencies pull in rdkafka, whose
    # rdkafka-sys cmake build compiles rdkafka_conf.c's `#include
    # <curl/curl.h>` on POSIX even with `-DWITH_CURL=0`; see
    # .agents/skills/saci-connectors/SKILL.md.
    - name: Install librdkafka build prerequisites
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-wasm-processor-${{ hashFiles('**/Cargo.lock') }}

    - name: Install component tooling
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-tools@1.246.2

    # cargo check of saci for wasm32-wasip3 with `--no-default-features
    # --features processor`. It protects the build instruction
    # `crates/saci/src/lib.rs`'s crate docs and AGENTS.md give processor
    # authors: the default `engine` implies `runtime` (tokio and rayon), and
    # tokio cannot target wasm32-wasip3, so a feature edge leaking tokio back
    # into `processor` would make that instruction false. The task installs
    # the target itself.
    - name: Check saci for wasm32-wasip3
      run: cargo xtask check-wasm-processor

    # The arrow-ipc exact pin is load-bearing across the component boundary;
    # crates/saci/PINS.md forbids relaxing it without this gate.
    - name: Host-processor arrow-ipc round-trip
      run: cargo xtask processor-ipc-roundtrip

    # Produced by the round-trip task above.
    - name: Validate smoketest component
      run: wasm-tools validate --features cm-async target/wasm32-wasip3/release/saci_processor_smoketest.wasm

    - name: Check smoketest WIT exports and WASI 0.3 imports
      run: |
        WASM=target/wasm32-wasip3/release/saci_processor_smoketest.wasm
        WIT=$(wasm-tools component wit "$WASM")
        printf '%s\n' "$WIT"
        echo "$WIT" | grep -q 'saci:pipeline/pipeline@0.4.0'
        echo "$WIT" | grep -q 'run-batch: async func('
        if echo "$WIT" | grep -q '@0\.2\.'; then
          echo "::error::component imports WASI 0.2 interface(s)"
          exit 1
        fi

    # The processors are built with `-C target-feature=+simd128` from
    # .cargo/config.toml, and a silently dropped rustflag costs real throughput
    # in the Arrow encode/decode paths. Three assertions, cheapest first: the
    # core module carries a target_features section, that section names simd128,
    # and LLVM actually emitted vector instructions. Only the third one is the
    # point of the flag; the section is present either way, so it cannot fail
    # alone. The smoketest yields 12989 matching lines with the flag and 0
    # without it, so the `-eq 0` threshold has no flake margin to worry about.
    - name: Assert simd128 in the core module
      run: |
        WASM=target/wasm32-wasip3/release/saci_processor_smoketest.wasm
        wasm-tools objdump "$WASM" | grep -q 'custom "target_features"'
        grep -qa simd128 "$WASM"
        vec=$(wasm-tools print "$WASM" \
          | grep -cE '(^|[^a-z0-9_])(v128|i8x16|i16x8|i32x4|i64x2|f32x4|f64x2)\.' || true)
        echo "vector instruction lines in the core module: $vec"
        if [ "$vec" -eq 0 ]; then
          echo "::error::core module has no v128 instructions: the +simd128 rustflag in .cargo/config.toml did not reach this build. An exported RUSTFLAGS replaces config-file rustflags wholesale rather than extending them."
          exit 1
        fi

  plugins_and_quickstart:
    name: Plugins, Conformance and Quick Start
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0  # Rust minimum version

    # saci's dev-dependencies pull in rdkafka, whose
    # rdkafka-sys cmake build compiles rdkafka_conf.c's `#include
    # <curl/curl.h>` on POSIX even with `-DWITH_CURL=0`; see
    # .agents/skills/saci-connectors/SKILL.md.
    - name: Install librdkafka build prerequisites
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: target
        key: ${{ runner.os }}-plugins-quickstart-${{ hashFiles('**/Cargo.lock') }}

    - name: Install wasm32-wasip3 target
      run: rustup target add wasm32-wasip3

    - name: Install component tooling
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-tools@1.246.2,cargo-nextest@0.9.143

    # Go version pinned in examples/plugins/settle-go/PINS.md.
    - uses: actions/setup-go@v6
      with:
        go-version: '1.25.5'

    # The conformance corpus is committed so wire codecs run without a Rust
    # toolchain. Regenerating it here proves the committed vectors still match
    # what the generator produces.
    - name: Conformance corpus is current
      run: |
        cargo run -p saci --features conformance --example conformance_vectors -- emit
        git diff --exit-code -- packages/arrow-ipc-conformance

    - name: Generate schema constants and fixtures
      run: |
        cargo run -p saci --features plugin-host --example plugin_schema_emit -- emit
        cp examples/plugins/generated/schema_gen.go examples/plugins/settle-go/schema_gen.go

    - name: Go wire codec and conformance tests
      working-directory: examples/plugins/settle-go
      run: go test ./...

    - name: Build native plugins
      run: cargo xtask plugins

    - name: Native plugin round-trip tests
      run: cargo nextest run -p saci --features plugin-host --test plugin_roundtrip

    - name: Build and validate Quick Start components
      run: cargo xtask quickstart

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.100.0  # Rust minimum version
    
    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit
    
    - name: Run security audit
      run: cargo audit