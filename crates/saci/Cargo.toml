[package]
name = "saci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
description = "SACI: a batch processing engine on Apache Arrow. The columnar engine, connectors, byte formats, the wasm processor and native plugin SDKs, and the service host, each behind its own feature."
readme = "README.md"
keywords = ["arrow", "etl", "dataflow", "wasm", "batch"]
categories = ["database", "wasm", "asynchronous", "concurrency"]

# No lints of its own. The empty table tells cargo this is intentional: a workspace that depends on saci by path and
# defines `[workspace.lints]` otherwise gets a `missing_lints_inheritance` warning on every build.
[lints]

[features]
default = ["engine"]

# Bundles

# What `cargo install saci --features server` builds: a `saci-service` binary
# that runs with nothing installed or already running alongside it. Seven
# connectors qualify: a channel inside the process, local disk, an HTTP client
# and listening HTTP source, a raw TCP socket, a raw UDP socket, a peer SACI
# service and an embedded redb file. Every connector that needs a specific
# broker, database, object store or OTLP endpoint first is opt-in, and so is a
# Raft cluster node, which is a deliberate deployment choice.
server = [
    "mimalloc", "service", "wasm-host", "windows", "parquet-checkpoint", "crypto",
    "connector-channel", "connector-file", "connector-http", "connector-tcp",
    "connector-udp", "connector-peer", "connector-redb",
    "codec-ndjson", "codec-csv", "codec-parquet",
    "codec-avro", "codec-arrow-ipc",
]
# The connectors that need nothing installed or already running.
connectors = [
    "connector-channel", "connector-file", "connector-redb", "connector-http",
    "connector-tcp", "connector-udp", "connector-peer",
]
codecs = [
    "codec-arrow-ipc", "codec-avro", "codec-csv",
    "codec-ndjson", "codec-parquet",
]
# Every capability the crate carries. `connector-kafka` is in here, so this
# build needs cmake and a C toolchain on PATH for its vendored librdkafka.
#
# `conformance` is deliberately absent: it enables `arrow-ipc/lz4`, which would
# make the host accept a compressed record batch the wire format otherwise
# rejects. It is the corpus generator's switch, not a capability.
# `tests/feature_bundles.rs` requires every other feature to be reachable from
# this list and fails if `conformance` is.
all = [
    "engine", "windows", "processor", "plugin", "server", "service-cluster",
    "plugin-host", "connectors", "codecs",
    "connector-clickhouse", "connector-kafka", "connector-mariadb",
    "connector-nats", "connector-otlp", "connector-postgresql",
    "connector-s3", "connector-turso",
]

# Engine

# The columnar engine: Dataset, Pipeline, System, Scheduler, Component, the
# Source/Sink traits and the schema cast helpers, with tokio and rayon stage
# parallelism. Cannot target wasm32-wasip3.
engine = ["dep:tokio", "dep:rayon", "dep:num_cpus", "derive"]
# `#[derive(Component)]`, `#[transform]` and `#[fold]`. Needs no tokio, so a
# wasm32-wasip3 processor carries it.
derive = ["dep:saci-macros"]
# Beam-style windowed aggregation.
windows = []
tracing = ["dep:tracing"]
# OpenTelemetry instruments: the service's own series and the connectors'.
metrics = ["dep:opentelemetry"]
# Trace context carried across a `saci` connector link.
trace-context = ["tracing", "dep:opentelemetry", "dep:tracing-opentelemetry"]
# Shared rustls (ring provider) TLS and mTLS transport helpers.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:rustls-platform-verifier"]
# Whole-payload and field-level AEAD data encryption (AES-256-GCM / ChaCha20-Poly1305) on `ring`.
crypto = ["engine", "dep:ring", "dep:base64", "dep:zeroize", "dep:tempfile"]

# Authoring SDKs

# A WebAssembly Component Model processor: Component Model Async execution on
# wasm32-wasip3, built with `--no-default-features --features processor`.
processor = ["derive"]
# A native plugin: a cdylib the host `dlopen`s.
plugin = ["engine", "dep:pollster", "dep:serde_json", "dep:base64"]

# Contracts, pulled in by the features below; not meant to be named directly.
# `serde_json/preserve_order` keeps a table in declaration order, so a config
# written back out as KDL does not depend on which other crate in the build
# enables it.
config = [
    "dep:kdl", "dep:serde_json", "dep:serde_path_to_error",
    "serde_json/preserve_order", "dep:chrono",
]
codec-api = ["engine", "config"]
connector-api = ["engine", "codec-api"]

# Byte formats
codec-arrow-ipc = ["codec-api"]
codec-avro = ["codec-api", "dep:arrow-avro", "tls", "dep:reqwest", "reqwest/json", "dep:ring", "dep:hex", "dep:uuid", "dep:chrono"]
codec-csv = ["codec-api", "dep:arrow-csv"]
codec-ndjson = ["codec-api", "dep:arrow-json"]
codec-parquet = ["codec-api", "dep:parquet", "dep:bytes"]

# Connectors. Kafka, NATS and UDP imply `codec-ndjson` and TCP implies
# `codec-arrow-ipc` so the feature alone is runnable; every other
# connector's node names its `transformer` and the user picks the formats.
connector-channel = ["connector-api"]
connector-file = ["connector-api"]
connector-http = [
    "connector-api", "tls", "dep:bytes", "dep:futures-util", "tokio/fs", "dep:tempfile",
    "dep:reqwest", "reqwest/http2", "reqwest/gzip", "reqwest/brotli", "reqwest/zstd", "reqwest/deflate",
    "dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util",
    "dep:h3", "dep:h3-quinn", "dep:quinn", "dep:brotli", "dep:flate2", "dep:zstd", "dep:subtle",
]
connector-kafka = ["connector-api", "dep:futures-util", "dep:rdkafka", "codec-ndjson"]
connector-nats = ["connector-api", "dep:futures-util", "tokio/fs", "dep:bytes", "dep:async-nats", "codec-ndjson"]
connector-otlp = [
    "connector-api", "tls", "dep:base64", "dep:bytes", "dep:serde_json", "tokio/net",
    "dep:opentelemetry-proto", "dep:prost",
    "dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util",
    "dep:reqwest", "reqwest/http2", "reqwest/gzip", "reqwest/brotli", "reqwest/zstd", "reqwest/deflate",
    "dep:subtle",
]
connector-postgresql = [
    "connector-api", "tls", "tokio/net", "tokio/io-util", "dep:futures-util",
    "dep:tokio-postgres", "dep:postgres-protocol", "dep:bytes",
    "dep:tokio-postgres-rustls", "dep:rustls-native-certs",
]
# MariaDB and MySQL servers share one connector.
connector-mariadb = [
    "connector-api", "tokio/net", "tokio/io-util", "dep:futures-util", "dep:serde_json",
    "dep:mysql_async", "dep:mysql_common",
    "dep:rustls", "mysql_async/rustls-tls", "mysql_async/ring", "mysql_async/tls12",
]
# ClickHouse speaks native ArrowStream over HTTP.
connector-clickhouse = [
    "connector-api", "dep:clickhouse", "clickhouse/rustls-tls-ring",
    "clickhouse/rustls-tls-webpki-roots", "dep:bytes", "tokio/net", "tokio/rt", "dep:url",
]
connector-turso = ["connector-api", "dep:serde_json", "dep:base64", "dep:turso"]
connector-s3 = [
    "connector-api", "dep:futures-util", "tokio/fs", "tokio/io-util",
    "dep:tempfile", "dep:object_store", "dep:chrono", "dep:base64",
]
connector-tcp = ["connector-api", "tls", "tokio/net", "tokio/io-util", "codec-arrow-ipc"]
connector-udp = ["connector-api", "tokio/net", "codec-ndjson", "dep:futures"]
connector-redb = ["connector-api", "dep:redb"]
connector-peer = ["connector-api", "tls", "tokio/net", "tokio/io-util"]

# Host

# In-process telemetry: time-bounded ring buffers fed by a `tracing` layer and
# an in-memory OpenTelemetry metric exporter, read back through the control
# plane's JSON API.
inspector = ["engine", "tracing", "metrics", "dep:tracing-subscriber", "dep:opentelemetry_sdk"]
distributed = [
    "engine", "dep:redb", "dep:uuid", "dep:serde_json", "dep:serde_bytes", "dep:hex",
    "tokio/net", "tokio/io-util", "dep:tokio-util",
]
distributed-raft = ["distributed", "dep:openraft", "dep:futures-util", "dep:postcard"]
# Archival Parquet checkpoint store.
parquet-checkpoint = ["distributed", "dep:parquet"]
# The WebAssembly processor host.
wasm-host = ["engine", "dep:wasmtime", "dep:wasmtime-wasi", "dep:sha3", "dep:pollster"]
# The native plugin host: dlopen a shared library exporting the plugin C ABI.
# `sha3` is the optional content digest for the library file.
plugin-host = ["engine", "dep:libloading", "dep:base64", "dep:serde_json", "dep:sha3"]
# Generator for the cross-language conformance corpus in
# packages/arrow-ipc-conformance/. `arrow-ipc/lz4` is enabled only here, so a
# normal build still refuses a compressed record batch: the corpus needs to
# WRITE one to prove every codec rejects it.
conformance = ["arrow-ipc/lz4", "dep:serde_json"]
# KDL configuration, the factory Registry, the runners, the axum control plane
# and the `saci-service` binary.
service = [
    "connector-api", "distributed", "parquet-checkpoint", "tracing", "inspector",
    "metrics", "trace-context",
    "dep:axum", "dep:tower", "dep:tower-http", "dep:tokio-util", "dep:tracing-subscriber",
    "dep:opentelemetry_sdk", "dep:opentelemetry-prometheus", "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry", "dep:prometheus", "dep:serde_json", "dep:postcard",
    "dep:clap", "dep:reqwest", "reqwest/json", "dep:rustls", "dep:dotenvy", "dep:futures",
]
service-cluster = ["service", "distributed-raft"]
mimalloc = ["dep:mimalloc"]

[dependencies]
arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
arrow-buffer  = { workspace = true }
arrow-select  = { workspace = true }
arrow-cast    = { workspace = true }
arrow-arith   = { workspace = true }
arrow-ord     = { workspace = true }
arrow-ipc     = { workspace = true }
serde_arrow   = { workspace = true }
async-trait   = { workspace = true }
futures       = { workspace = true, optional = true }
serde         = { workspace = true }
fnv           = { workspace = true }
rand          = { workspace = true }
regex         = { workspace = true }

# Engine and SDKs
tokio         = { workspace = true, optional = true }
rayon         = { workspace = true, optional = true }
num_cpus      = { workspace = true, optional = true }
tracing       = { workspace = true, optional = true }
pollster      = { version = "1.0.3", optional = true }
saci-macros   = { workspace = true, optional = true }
kdl           = { workspace = true, optional = true }
serde_json    = { workspace = true, optional = true }
serde_path_to_error = { version = "0.1.20", optional = true }
base64        = { workspace = true, optional = true }
bytes         = { workspace = true, optional = true }
futures-util  = { workspace = true, optional = true }
tempfile      = { workspace = true, optional = true }
opentelemetry = { version = "0.33", optional = true }
# 0.34 is the release that depends on the `opentelemetry 0.33` line.
tracing-opentelemetry = { version = "0.34", optional = true }

# Byte formats
arrow-avro    = { workspace = true, optional = true }
arrow-csv     = { workspace = true, optional = true }
arrow-json    = { workspace = true, optional = true }
parquet       = { workspace = true, optional = true }

# Connectors
reqwest       = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
rustls-pki-types = { version = "1.16", features = ["std"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
http          = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper         = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-util    = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
tokio-rustls  = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
h3            = { version = "0.0.8", optional = true }
h3-quinn      = { version = "0.0.10", optional = true }
quinn         = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
brotli        = { version = "9.1.3", optional = true }
flate2        = { version = "1", optional = true }
zstd          = { version = "0.14.4", optional = true }
subtle        = { version = "2", optional = true }
ring          = { version = "0.17", optional = true }
zeroize       = { version = "1.9", features = ["derive"], optional = true }
rdkafka       = { version = "0.40", features = ["cmake-build"], optional = true }
async-nats    = { version = "0.53.0", default-features = false, features = [
    "jetstream", "nkeys", "nuid", "ring", "server_2_10", "server_2_12", "server_2_14",
], optional = true }
opentelemetry-proto = { workspace = true, optional = true }
prost         = { workspace = true, optional = true }
tokio-postgres = { version = "0.7.18", optional = true }
postgres-protocol = { version = "0.6.12", optional = true }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"], optional = true }
mysql_async   = { workspace = true, optional = true }
mysql_common  = { workspace = true, optional = true }
clickhouse    = { workspace = true, optional = true }
url           = { version = "2", optional = true }
turso         = { workspace = true, optional = true }
object_store  = { version = "0.14.2", default-features = false, features = ["aws"], optional = true }
chrono        = { version = "0.4.45", default-features = false, features = ["clock", "std"], optional = true }
redb          = { workspace = true, optional = true }

# Host
uuid          = { workspace = true, optional = true }
serde_bytes   = { workspace = true, optional = true }
hex           = { version = "0.4.3", optional = true }
tokio-util    = { workspace = true, optional = true }
openraft      = { version = "0.10.1", features = ["serde"], optional = true }
postcard      = { workspace = true, optional = true }
wasmtime      = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
sha3          = { workspace = true, optional = true }
libloading    = { workspace = true, optional = true }
axum          = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"], optional = true }
tower         = { version = "0.5", optional = true }
tower-http    = { version = "0.7", default-features = false, features = ["trace", "timeout", "limit"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi"], optional = true }
opentelemetry_sdk = { version = "0.33", features = ["metrics", "trace"], optional = true }
opentelemetry-prometheus = { version = "0.33", optional = true }
prometheus    = { version = "0.14", default-features = false, optional = true }
# `reqwest-blocking-client` is the exporter default and the only client the
# non-experimental `BatchSpanProcessor` supports: that processor owns an OS
# thread and drives the exporter with `futures_executor::block_on`, so an async
# client would have no reactor. It shares the `reqwest 0.13` tree the CLI's own
# client lives in, the one reqwest generation the crate links.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
clap          = { version = "4", features = ["derive", "env"], optional = true }
# Loads a repo-root `.env` for cloud-service credentials, so `${VAR}`
# placeholders in a config resolve without a manual export.
dotenvy       = { workspace = true, optional = true }
mimalloc      = { version = "0.1.52", optional = true }

[dev-dependencies]
anyhow        = { workspace = true }
arrow-array   = { workspace = true }
arrow-buffer  = { workspace = true }
arrow-ipc     = { workspace = true }
arrow-schema  = { workspace = true }
async-nats    = { version = "0.53.0", default-features = false, features = ["jetstream", "ring"] }
base64        = { workspace = true }
clickhouse    = { workspace = true }
criterion     = { workspace = true }
# The reference engine the `vs_datafusion_q6` bench measures against.
datafusion    = { version = "55", default-features = false, features = ["sql", "parquet"] }
dotenvy       = { workspace = true }
futures       = { workspace = true }
libc          = { workspace = true }
mimalloc      = "0.1.52"
mysql_async   = { workspace = true }
num_cpus      = { workspace = true }
openraft      = { version = "0.10.1", features = ["serde"] }
opentelemetry = { version = "0.33" }
opentelemetry-prometheus = { version = "0.33" }
opentelemetry_sdk = { version = "0.33", features = ["metrics", "trace"] }
postcard      = { workspace = true }
prometheus    = { version = "0.14", default-features = false }
rayon         = { workspace = true }
rcgen         = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rdkafka       = { version = "0.40", features = ["cmake-build"] }
redb          = { workspace = true }
reqwest       = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "blocking"] }
# The provider the dev-dependency reqwest needs: `rustls-no-provider` refuses
# to build a client until one is installed, whatever features the build names.
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde         = { workspace = true }
serde_arrow   = { workspace = true }
serde_json    = { workspace = true }
sha3          = { workspace = true }
tempfile      = { workspace = true }
testcontainers = "0.28"
tokio         = { workspace = true, features = ["fs"] }
tokio-postgres = "0.7.18"
tokio-util    = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }
turso         = { workspace = true }
uuid          = { workspace = true }

[[bin]]
name = "saci-service"
path = "src/bin/saci-service/main.rs"
required-features = ["service"]

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "batch_vs_stream"
harness = false
required-features = ["engine"]

[[bench]]
name = "windows"
harness = false
required-features = ["windows"]

[[bench]]
name = "parallelism"
harness = false

[[bench]]
name = "parallelism_compute"
harness = false

[[bench]]
name = "tpch_q1"
harness = false

[[bench]]
name = "tpch_q6"
harness = false

[[bench]]
name = "ipc_checkpoint"
harness = false

[[bench]]
name = "vs_datafusion_q6"
harness = false

[[bench]]
name = "distributed"
harness = false
required-features = ["distributed"]

[[bench]]
name = "wasm_roundtrip"
harness = false
# `wasm-host` carries the host runtime this measures; `service` is what puts
# the `tracing` span and the metrics write on the measured path, so the figures
# match what the shipped binary pays.
required-features = ["service", "wasm-host"]

# The examples that need nothing outside this crate live in its own `examples/`
# directory, so the published package carries them. The rest load processor
# components, configs or services from the repository and stay under its
# top-level `examples/`, which `cargo package` cannot reach.
[[example]]
name = "first_pipeline"
required-features = ["engine"]

[[example]]
name = "scheduler_etl"
required-features = ["engine"]

[[example]]
name = "scheduler_etl_parallel"
required-features = ["engine"]

[[example]]
name = "scheduler_dag"
required-features = ["engine"]

[[example]]
name = "distributed_scheduler"
required-features = ["distributed"]

[[example]]
name = "window_aggregation"
required-features = ["windows"]

[[example]]
name = "distributed_windowed"
required-features = ["distributed", "windows"]

[[example]]
name = "windowed_fan_in"
# Two ChannelSources merged into one windowed processor: the fan-in merge and
# the host-side watermark both live in the service runner.
required-features = ["service", "windows", "connector-channel"]

[[example]]
name = "distributed_fulfillment"
path = "../../examples/distributed_fulfillment/main.rs"
required-features = ["service-cluster"]

[[example]]
name = "plugin_schema_emit"
path = "../../examples/plugins/schema_emit.rs"
required-features = ["plugin-host"]

[[example]]
name = "native_plugin"
path = "../../examples/plugins/native_plugin.rs"
required-features = ["plugin-host"]

[[example]]
name = "conformance_vectors"
path = "../../examples/conformance/conformance_vectors.rs"
required-features = ["conformance"]

[[example]]
name = "stream_latency"
path = "../../examples/native/stream_latency.rs"
required-features = ["service", "connector-channel", "wasm-host"]

# The four publishers reach `async-nats` through the NATS connector, so each
# names the connector feature: `cargo check --examples` stays green whatever
# features are selected.
[[example]]
name = "quickstart_publish"
path = "../../examples/quickstart/quickstart_publish.rs"
required-features = ["connector-nats"]

[[example]]
name = "branching_publish"
path = "../../examples/branching/branching_publish.rs"
required-features = ["connector-nats"]

[[example]]
name = "windowed_publish"
path = "../../examples/windowing/windowed_publish.rs"
required-features = ["connector-nats"]

[[example]]
name = "multi_workflow_publish"
path = "../../examples/multi_workflow/multi_workflow_publish.rs"
required-features = ["connector-nats"]

[[example]]
name = "integrity_check"
path = "../../examples/integrity/integrity_check.rs"
# Also an HTTP receiver and a control-plane client: it needs `axum` and
# `reqwest`, both of which `service` turns on. Its three publish transports
# reach it through `rdkafka`, `async-nats` and `tokio-postgres`, which are
# unconditional dev-dependencies, so no connector feature is named.
required-features = [
    "service", "codec-arrow-ipc", "codec-csv", "codec-ndjson",
    "codec-parquet",
]

[[example]]
name = "scheduler_parquet_etl"
required-features = ["connector-file", "codec-csv", "codec-ndjson", "codec-parquet"]

[[example]]
name = "mariadb_roundtrip"
path = "../../examples/connectors/mariadb_roundtrip.rs"
required-features = ["connector-mariadb"]

[[example]]
name = "postgres_roundtrip"
path = "../../examples/connectors/postgres_roundtrip.rs"
required-features = ["connector-postgresql"]

[[example]]
name = "encrypted_pipelines"
required-features = ["crypto", "connector-peer", "connector-file", "codec-parquet"]
