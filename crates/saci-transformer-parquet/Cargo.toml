[package]
name = "saci-transformer-parquet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The parquet byte format for SACI: a Transformer reading and writing Parquet with Snappy compression."

[dependencies]
# `io` for `cast_batch`: the file carries its own schema, so a batch is
# projected onto the declared `schema_fields` with the ingestion layer's
# existing helper.
saci-core        = { workspace = true, features = ["io"] }
saci-transformer = { workspace = true }

arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
# `concat_batches` folds a payload window into one batch, and `arrow-cast`
# supplies the projection's cast kernel.
arrow-select  = { workspace = true }
arrow-cast    = { workspace = true }
bytes         = { workspace = true }
parquet       = { workspace = true }

[dev-dependencies]
tempfile      = { workspace = true }
