[package]
name = "saci-inspector-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The JSON contract the saci-service inspector serves and the saci-service-ui dashboard consumes."
license.workspace = true
