[package]
name = "saci-connector-udp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Fire-and-forget UDP Source and Sink for SACI: one datagram per message in either direction, an optional liveness probe on the sink. A transformer decodes and encodes the payload."

[features]
tracing = ["dep:tracing", "saci-core/tracing"]

[dependencies]
saci-core      = { workspace = true, features = ["io"] }
saci-connector = { workspace = true }
saci-transformer = { workspace = true }

arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
async-trait   = { workspace = true }
# The probe round polls every peer at once, so a round costs one timeout
# however many peers a sink names.
futures       = { workspace = true }
# `net` is not in the workspace tokio feature set; this crate binds a datagram
# socket on both halves. `time` (the probe's deadline) and `sync` (the source's
# batch channel) come from the workspace set.
tokio         = { workspace = true, features = ["net"] }
tracing       = { workspace = true, optional = true }

[dev-dependencies]
# Two real payload transformers: `arrow-ipc` is one message per batch,
# `ndjson` one per row, which is what the datagram-per-message tests need on
# both sides of the wire.
saci-transformer-arrow-ipc = { workspace = true }
saci-transformer-ndjson    = { workspace = true }

tokio         = { workspace = true }
