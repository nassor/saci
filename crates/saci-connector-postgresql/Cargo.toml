[package]
name = "saci-connector-postgresql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "PostgreSQL Source and Sink for SACI. Reads through incremental polling, a trigger-written outbox table, or pgoutput logical decoding over the SQL slot interface; writes through COPY FORMAT binary with optional staged upsert."

[features]
# TLS is on by default: an unencrypted Postgres connection is the unusual case.
default = ["tls"]
tls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types"]
tracing = ["dep:tracing", "saci-core/tracing"]
# Emits into the process-global OpenTelemetry meter the saci-service binary
# installs. Off by default because a library consumer may have no provider.
metrics = ["dep:opentelemetry"]

[dependencies]
saci-core      = { workspace = true, features = ["io"] }
saci-connector = { workspace = true }

arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
# `ListArray` is assembled by hand from its offsets and validity, because the
# element decoder is this crate's own enum rather than an `ArrayBuilder`.
arrow-buffer  = { workspace = true }
async-trait   = { workspace = true }
# `net` and `io-util` are not in the workspace tokio feature set; tokio-postgres
# turns them on itself, but this crate opens sockets so it declares them.
tokio         = { workspace = true, features = ["net", "io-util"] }
# `stream::poll_fn` drives `Connection::poll_message` so LISTEN/NOTIFY reaches
# the source; `SinkExt` feeds the COPY sink.
futures-util  = { workspace = true }
serde         = { workspace = true }
rand          = { workspace = true }
tracing       = { workspace = true, optional = true }

# The driver. `binary_copy` supplies the PGCOPY BINARY writer the sink bulk
# loads through, and query results already arrive in PostgreSQL binary format,
# so nothing text-shaped sits between the socket and an Arrow builder.
tokio-postgres = { version = "0.7.18" }
# Direct dependency for `escape::escape_identifier`: every table and column
# name in this connector comes from configuration and must be quoted.
postgres-protocol = { version = "0.6.12" }
# tokio-postgres's buffer type; needed to implement ToSql for the COPY encoder.
bytes = { version = "1.11" }

# rustls rather than native-tls: saci-service already links rustls through
# reqwest, and `ring` is pinned to match so the process has one crypto backend.
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"], optional = true }
rustls              = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# PEM parsing for `sslrootcert`. rustls already depends on this crate, and its
# `PemObject` trait replaces the unmaintained rustls-pemfile.
rustls-pki-types    = { version = "1.15", features = ["std"], optional = true }

opentelemetry = { version = "0.32", optional = true }

[dev-dependencies]
tokio          = { workspace = true }
# The Postgres container the integration tests drive. The core crate rather
# than `testcontainers-modules`: the modules crate pins testcontainers ^0.27
# against the workspace's 0.28, and every test needs a custom
# `postgres -c wal_level=logical` command line anyway, which is a GenericImage
# either way.
testcontainers = "0.28"
anyhow         = { workspace = true }
arrow-array    = { workspace = true }
arrow-schema   = { workspace = true }
# The TLS tests re-encode a certificate from the OS trust store into PEM and
# feed it back through `sslrootcert`, so no certificate fixture is committed.
base64         = { workspace = true }
tempfile       = { workspace = true }

[[example]]
name = "postgres_roundtrip"
path = "../../examples/connectors/postgres_roundtrip.rs"
