[package]
name = "saci-connector-clickhouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "ClickHouse Source and Sink for SACI via HTTP interface with native Arrow IPC streaming."

[features]
default = ["tls"]
tls = ["clickhouse/rustls-tls-ring", "clickhouse/rustls-tls-webpki-roots"]
tracing = ["dep:tracing", "saci-core/tracing"]

[dependencies]
saci-core      = { workspace = true, features = ["io"] }
saci-connector = { workspace = true }

arrow-select   = { workspace = true }
clickhouse     = { workspace = true }

arrow-array    = { workspace = true }
arrow-schema   = { workspace = true }
arrow-ipc      = { workspace = true }
arrow-cast     = { workspace = true }
bytes          = { workspace = true }

async-trait    = { workspace = true }
tokio          = { workspace = true, features = ["net", "rt", "time"] }
serde          = { workspace = true }
tracing        = { workspace = true, optional = true }
url            = "2"

[dev-dependencies]
tokio          = { workspace = true, features = ["rt-multi-thread", "macros"] }
testcontainers = "0.28"
anyhow         = { workspace = true }
tempfile       = { workspace = true }
serde_json      = { workspace = true }
