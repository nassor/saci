[package]
name = "saci-plugin-smoketest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# CI fixture, not a library a downstream consumer would depend on.
publish = false
description = "Minimal saci-plugin consumer used as the native plugin load fixture and Arrow IPC round-trip fixture."

# This crate exists to verify:
#   1. `export_plugin!` expands cleanly and the resulting cdylib exports
#      `saci_abi_version` and `saci_plugin_v1`.
#   2. The host can dlopen it, read its descriptor, and round-trip a batch.
#   3. Config reaches a plugin, and a checkpoint survives a batch boundary.
#   4. arrow-ipc stays pinned at the exact workspace version across the
#      boundary. This crate is a workspace member, so the pin propagates.
#
# `cargo test -p saci-service` does not build unrelated workspace members, so
# `crates/saci-service/tests/plugin_roundtrip.rs` names
# `cargo build -p saci-plugin-smoketest` in its assertion message.
[lib]
crate-type = ["cdylib"]

[dependencies]
saci-plugin = { workspace = true }
serde       = { workspace = true }
