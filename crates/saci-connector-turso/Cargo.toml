[package]
name = "saci-connector-turso"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Turso Source and Sink for SACI. Reads through incremental cursor polling, a full-table dump, or the turso_cdc change table; writes through prepared INSERT with optional ON CONFLICT upsert and optional change capture."

[features]
default = []
tracing = ["dep:tracing", "saci-core/tracing"]
# Emits into the process-global OpenTelemetry meter the saci-service binary
# installs. Off by default because a library consumer may have no provider.
metrics = ["dep:opentelemetry"]

[dependencies]
saci-core      = { workspace = true, features = ["io"] }
saci-connector = { workspace = true }

arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
async-trait   = { workspace = true }
tokio         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
# CDC `before`/`after` images reach a JSON object as text; a BLOB column is
# carried in it as an encoded string this crate decodes back to bytes.
base64        = { workspace = true }
tracing       = { workspace = true, optional = true }

# The engine. `default-features = false` is load-bearing: the turso crate's
# default `mimalloc` feature installs a `#[global_allocator]`, which collides
# with the allocator every host binary (saci-service included) already sets.
# `sync` adds the HTTP/TLS path for a synced remote replica.
turso = { workspace = true }

opentelemetry = { version = "0.32", optional = true }

[dev-dependencies]
tokio        = { workspace = true }
tempfile     = { workspace = true }
anyhow       = { workspace = true }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
dotenvy      = { workspace = true }
