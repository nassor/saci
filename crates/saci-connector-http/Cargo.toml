[package]
name = "saci-connector-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "HTTP Source, Sink and push Source for SACI over HTTP/1.1, HTTP/2 and HTTP/3. The source reads one document or a live stream, the sink sends one document per RecordBatch, and the push source listens."

[features]
tracing = ["dep:tracing", "saci-core/tracing"]
# Emits into the process-global OpenTelemetry meter the saci-service binary
# installs. Off by default because a library consumer may have no provider.
metrics = ["dep:opentelemetry"]

[dependencies]
saci-core        = { workspace = true, features = ["io"] }
saci-connector   = { workspace = true }
saci-transformer = { workspace = true }

arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
async-trait   = { workspace = true }
bytes         = { workspace = true }
futures-util  = { workspace = true }
# `fs` carries `tokio::fs::File::from_std`, which is how a response body reaches
# the spool file chunk by chunk instead of through one whole-body copy.
tokio         = { workspace = true, features = ["fs"] }
# A runtime dependency, not a test one: the stream read surface takes a
# `std::fs::File` because parquet reads its footer before any row group, so the
# response body is spooled to an unnamed temp file the OS reclaims on close.
tempfile      = { workspace = true }
# 0.13.4, the version saci-service already pins, so the two share one tree.
#
# `rustls-no-provider` is the only TLS feature in that release which does not
# pull `aws-lc-rs`: the `rustls` feature implies `__rustls-aws-lc-rs`, and 0.13
# has no `rustls-tls-ring` or `webpki-roots` feature at all. Roots therefore
# come from `rustls-platform-verifier`, the OS trust store, not from a bundled
# webpki set. The workspace standardises on `ring` (saci-connector-postgresql
# links it, saci-service pairs these same two dependencies with the same
# features), so the provider is installed before any client is built.
#
# `http2` is what `http_version "2"` selects, over ALPN on https and by prior
# knowledge on http. `gzip`, `brotli`, `zstd` and `deflate` make the request's
# `accept-encoding` and the response's transparent decoding automatic, which is
# what lets a source read a compressed body with no key at all. reqwest's own
# `http3` is deliberately not enabled: it is `compile_error!`-gated behind
# `--cfg reqwest_unstable` and implies `rustls` -> `aws-lc-rs`, so HTTP/3 is
# spoken through `h3` below instead. Nothing here needs `json` or `blocking`.
reqwest       = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "zstd", "deflate"] }
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The trust store reqwest reaches through its own rustls feature, named here
# because the h3 client and the push source build their rustls configurations
# themselves and need the same verifier.
rustls-platform-verifier = { version = "0.7" }
# PEM parsing for the `tls` block, the same crate and `PemObject` pattern
# saci-connector-postgresql's `build_client_config` uses.
rustls-pki-types = { version = "1.15", features = ["std"] }
# The push listener. `server-auto` sniffs the HTTP/2 connection preface, so
# HTTP/1.1 and h2c prior knowledge share one TCP listener and ALPN picks under
# TLS.
http             = { version = "1" }
http-body-util   = { version = "0.1" }
hyper            = { version = "1", features = ["server", "http1", "http2"] }
hyper-util       = { version = "0.1", features = ["server-auto", "tokio"] }
# `default` pulls `aws_lc_rs`; `ring` is the provider the workspace links.
tokio-rustls  = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# HTTP/3. h3-quinn declares quinn with `default-features = false`, so quinn's
# own `platform-verifier` and `bloom` features are off unless named here.
h3            = { version = "0.0.8" }
h3-quinn      = { version = "0.0.10" }
quinn         = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# Request-body compression for the sink's `content_encoding`, one crate per
# encoding reqwest decodes on the way back.
brotli        = { version = "9.0.0" }
flate2        = { version = "1" }
zstd          = { version = "0.14.0" }
# Constant-time comparison for the push source's bearer token.
subtle        = { version = "2" }
tracing       = { workspace = true, optional = true }
# The same local pin saci-service, saci-connector-saci and
# saci-connector-postgresql carry.
opentelemetry = { version = "0.32", optional = true }

[dev-dependencies]
# The format the round-trip and factory tests read and write. csv is the
# stream-surface format that also requires a declared schema, so it exercises
# both the source's `schema_fields` path and the sink's.
saci-transformer-csv = { workspace = true }
# The self-describing counterpart: it refuses a declared schema, so it is what
# `schema_from "body"` exists for.
saci-transformer-parquet = { workspace = true }
# The message-decoder format the streaming read modes and the push source's
# line-oriented tests use: one json object per line is one frame.
saci-transformer-ndjson = { workspace = true }

tokio         = { workspace = true, features = ["fs"] }
# A self-signed certificate for the TLS and HTTP/3 tests, generated in-process
# so no fixture file is committed and nothing has to be installed.
rcgen         = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
