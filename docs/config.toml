base_url = "https://nassor.github.io/saci"
title = "SACI Documentation"
description = "Distributed Batch Processing for Rust, on Apache Arrow."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false

# Output to docs/public so GitHub Pages workflow can upload it.
output_dir = "public"

# Pretty URLs (default true): /world.md → /world/
[markdown]
render_emoji = false

# Class mode keeps the inline `style` attribute off `<pre>`, so the site's own
# light/dark rules and the `data-theme` toggle still paint the code frame.
# Zola writes a `giallo.css` for the theme below; no page links it, because the
# Prism `.token.*` rules in `styles.css` colour the tokens. The section exists
# so a fence annotation such as ```rust,name=The build script reaches the page
# as `data-name`, which `script.js` renders as the frame caption.
[markdown.highlighting]
theme = "ayu-dark"
style = "class"

[extra]
github_repo = "https://github.com/nassor/saci"
crates_io = "https://crates.io/crates/saci"
docs_rs = "https://docs.rs/saci"

# The two documentation areas, declared once. `base.html` renders the area
# switch, the sidebar, the breadcrumb and the previous/next pager from this
# list, so all four agree. The pager never crosses an area boundary.
# A group collapses in the sidebar, so a hub item keeps its children here
# rather than hiding them behind the hub page alone.
