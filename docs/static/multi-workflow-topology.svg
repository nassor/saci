<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" role="img" aria-labelledby="multi-workflow-topology-title multi-workflow-topology-desc">
  <title id="multi-workflow-topology-title">Two workflows joined by one in-process channel: route splits orders, settle windows the standard branch plus a second subject</title>
  <desc id="multi-workflow-topology-desc">
    Two workflows in one service. The route workflow reads the NATS subject multi.orders in orders_in and passes each batch to router, a WASM processor. router names the branch rush when the first row amount is at least 100 and the branch standard otherwise. The rush link goes to the PostgreSQL sink rush_sales. The standard link goes to standard_bridge, a channel sink on the in-process channel named standard. That channel is the only crossing between the workflows: it ends at standard_in, a channel source in the settle workflow. The settle workflow also reads the NATS subject multi.offsets in offsets_in. standard_in and offsets_in both feed window_sales, a WASM processor that builds 30 second tumbling windows, and window_sales writes closed windows to the PostgreSQL sink window_totals.
  </desc>

  <style>
    text { font-family: 'Fira Code', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }

    /* Catppuccin Latte, with Mocha below for a dark viewer. Site CSS does not
       reach a standalone figure, so both flavours live here. An accent tints
       an area; the darker ink tone draws lines and sets letters, which is
       what Latte needs to hold 4.5:1 and 3:1. */
    .canvas { fill: #eff1f5; stroke: #7c7f93; }
    .panel  { fill: #e6e9ef; stroke: #acb0be; }

    .blk   { fill: #eff1f5; stroke-width: 1; }
    .blk-d { stroke: rgb(171 63 0 / 0.7); }
    .blk-c { stroke: rgb(0 109 115 / 0.7); }
    .blk-b { stroke: rgb(128 46 229 / 0.7); }

    .hd-d { fill: #f2d2c2; }
    .hd-c { fill: #bfdce1; }
    .hd-b { fill: #d8c9f4; }

    /* The badges sit on the panel, not on the canvas, so the wash under the
       step number is thinner than the one the site uses on the page. */
    .badge   { stroke-width: 1; }
    .badge-d { fill: rgb(254 100 11 / 0.12);  stroke: rgb(171 63 0 / 0.8); }
    .badge-c { fill: rgb(23 146 153 / 0.12);  stroke: rgb(0 109 115 / 0.8); }
    .badge-b { fill: rgb(136 57 239 / 0.12);  stroke: rgb(128 46 229 / 0.8); }

    .t-ttl  { font-size: 13px;   font-weight: 600; fill: #4c4f69; }
    .t-sub  { font-size: 11px;   fill: #5c5f77; }
    .t-lab  { font-size: 11px;   fill: #5c5f77; }
    .t-step { font-size: 12px;   font-weight: 700; letter-spacing: 1px; }
    .t-num  { font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    .t-mid  { text-anchor: middle; }

    .f-n { fill: #5c5f77; }
    .f-d { fill: #ab3f00; }
    .f-c { fill: #006d73; }
    .f-b { fill: #802ee5; }

    .arw  { stroke-width: 1.5; fill: none; }
    .s-n  { stroke: #5c5f77; }
    .s-d  { stroke: #ab3f00; }
    .s-c  { stroke: #006d73; }
    .s-b  { stroke: #802ee5; }
    .dash { stroke-dasharray: 5 4; }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1e1e2e; stroke: #6c7086; }
      .panel  { fill: #181825; stroke: #45475a; }

      .blk   { fill: #313244; }
      .blk-d { stroke: rgb(250 179 135 / 0.7); }
      .blk-c { stroke: rgb(148 226 213 / 0.7); }
      .blk-b { stroke: rgb(203 166 247 / 0.7); }

      .hd-d { fill: #5d4e53; }
      .hd-c { fill: #475964; }
      .hd-b { fill: #534c6b; }

      .badge-d { fill: rgb(250 179 135 / 0.18);  stroke: rgb(250 179 135 / 0.8); }
      .badge-c { fill: rgb(148 226 213 / 0.18); stroke: rgb(148 226 213 / 0.8); }
      .badge-b { fill: rgb(203 166 247 / 0.18); stroke: rgb(203 166 247 / 0.8); }

      .t-ttl { fill: #cdd6f4; }
      .t-sub { fill: #a6adc8; }
      .t-lab { fill: #a6adc8; }

      .f-n { fill: #a6adc8; }
      .f-d { fill: #fab387; }
      .f-c { fill: #94e2d5; }
      .f-b { fill: #cba6f7; }

      .s-n { stroke: #a6adc8; }
      .s-d { stroke: #fab387; }
      .s-c { stroke: #94e2d5; }
      .s-b { stroke: #cba6f7; }
    }
  </style>

  <rect class="canvas" x="0.5" y="0.5" width="659" height="403" rx="14"/>

  <rect class="panel" x="16" y="12" width="628" height="166" rx="12"/>
  <text class="t-step f-n" x="36" y="36">ROUTE WORKFLOW</text>
  <g>
    <rect class="blk blk-c" x="36" y="80" width="150" height="52" rx="8"/>
    <rect class="hd-c" x="36" y="80" width="150" height="22" rx="8"/>
    <rect class="hd-c" x="36" y="94" width="150" height="8"/>
    <text class="t-ttl" x="48" y="96">orders_in</text>
    <text class="t-sub" x="48" y="120">NATS multi.orders</text>
  </g>
  <g>
    <rect class="blk blk-b" x="216" y="80" width="130" height="52" rx="8"/>
    <rect class="hd-b" x="216" y="80" width="130" height="22" rx="8"/>
    <rect class="hd-b" x="216" y="94" width="130" height="8"/>
    <text class="t-ttl" x="228" y="96">router</text>
    <text class="t-sub" x="228" y="120">WASM, per batch</text>
  </g>
  <g>
    <rect class="blk blk-c" x="454" y="48" width="170" height="52" rx="8"/>
    <rect class="hd-c" x="454" y="48" width="170" height="22" rx="8"/>
    <rect class="hd-c" x="454" y="62" width="170" height="8"/>
    <text class="t-ttl" x="466" y="64">rush_sales</text>
    <text class="t-sub" x="466" y="88">PostgreSQL</text>
  </g>
  <g>
    <rect class="blk blk-c" x="454" y="112" width="170" height="52" rx="8"/>
    <rect class="hd-c" x="454" y="112" width="170" height="22" rx="8"/>
    <rect class="hd-c" x="454" y="126" width="170" height="8"/>
    <text class="t-ttl" x="466" y="128">standard_bridge</text>
    <text class="t-sub" x="466" y="152">channel sink standard</text>
  </g>
  <path class="arw s-d" d="M186 106 H214" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M346 106 H376 V74 H452" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M346 106 H376 V138 H452" marker-end="url(#m-d)"/>
  <text class="t-lab f-d" x="382" y="68">rush</text>
  <text class="t-lab f-d" x="382" y="132">standard</text>
  <rect class="panel" x="16" y="212" width="628" height="176" rx="12"/>
  <text class="t-step f-n" x="36" y="236">SETTLE WORKFLOW</text>
  <g>
    <rect class="blk blk-c" x="36" y="250" width="150" height="52" rx="8"/>
    <rect class="hd-c" x="36" y="250" width="150" height="22" rx="8"/>
    <rect class="hd-c" x="36" y="264" width="150" height="8"/>
    <text class="t-ttl" x="48" y="266">standard_in</text>
    <text class="t-sub" x="48" y="290">channel source</text>
  </g>
  <g>
    <rect class="blk blk-c" x="36" y="322" width="150" height="52" rx="8"/>
    <rect class="hd-c" x="36" y="322" width="150" height="22" rx="8"/>
    <rect class="hd-c" x="36" y="336" width="150" height="8"/>
    <text class="t-ttl" x="48" y="338">offsets_in</text>
    <text class="t-sub" x="48" y="362">NATS multi.offsets</text>
  </g>
  <g>
    <rect class="blk blk-b" x="216" y="286" width="160" height="52" rx="8"/>
    <rect class="hd-b" x="216" y="286" width="160" height="22" rx="8"/>
    <rect class="hd-b" x="216" y="300" width="160" height="8"/>
    <text class="t-ttl" x="228" y="302">window_sales</text>
    <text class="t-sub" x="228" y="326">WASM, tumbling 30 s</text>
  </g>
  <g>
    <rect class="blk blk-c" x="454" y="286" width="170" height="52" rx="8"/>
    <rect class="hd-c" x="454" y="286" width="170" height="22" rx="8"/>
    <rect class="hd-c" x="454" y="300" width="170" height="8"/>
    <text class="t-ttl" x="466" y="302">window_totals</text>
    <text class="t-sub" x="466" y="326">PostgreSQL</text>
  </g>
  <path class="arw s-d" d="M186 276 H200 V312 H214" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M186 348 H200 V312 H214" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M376 312 H452" marker-end="url(#m-d)"/>
  <path class="arw s-d dash" d="M539 164 V194 H170 V248" marker-end="url(#m-d)"/>
  <text class="t-lab f-d" x="180" y="188">in-process channel: standard</text>

  <defs>
    <marker id="m-n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-n"/>
    </marker>
    <marker id="m-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-d"/>
    </marker>
    <marker id="m-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-b"/>
    </marker>
    <marker id="m-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-c"/>
    </marker>
  </defs>
</svg>
