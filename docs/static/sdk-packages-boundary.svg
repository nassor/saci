<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 236" role="img" aria-labelledby="sdkp-title sdkp-desc">
  <title id="sdkp-title">How a SACI host and a processor built with an SDK package exchange one batch</title>
  <desc id="sdkp-desc">
    The saci-service host, on the left, marshals a batch to Arrow IPC bytes and calls run-batch across
    the WIT boundary. Inside the WASM processor component, the SDK codec decodes the stream using only
    the language's standard library. Your transforms read typed rows and write mutated rows back, and
    the codec encodes the result. The component returns run-result to the host with the IPC bytes, the
    checkpoint and the metrics.
  </desc>

  <style>
    text { font-family: 'Fira Code', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }

    /* Catppuccin Latte, with Mocha below for a dark viewer. Site CSS does not
       reach a standalone figure, so both flavours live here. An accent tints
       an area; the darker ink tone draws lines and sets letters, which is
       what Latte needs to hold 4.5:1 and 3:1. */
    .canvas { fill: #eff1f5; stroke: #7c7f93; }
    .panel  { fill: #e6e9ef; stroke: #acb0be; }

    .blk   { fill: #eff1f5; stroke-width: 1; }
    .blk-d { stroke: rgb(171 63 0 / 0.7); }
    .blk-c { stroke: rgb(0 109 115 / 0.7); }
    .blk-b { stroke: rgb(128 46 229 / 0.7); }

    .hd-d { fill: #f2d2c2; }
    .hd-c { fill: #bfdce1; }
    .hd-b { fill: #d8c9f4; }

    /* The badges sit on the panel, not on the canvas, so the wash under the
       step number is thinner than the one the site uses on the page. */
    .badge   { stroke-width: 1; }
    .badge-d { fill: rgb(254 100 11 / 0.12);  stroke: rgb(171 63 0 / 0.8); }
    .badge-c { fill: rgb(23 146 153 / 0.12);  stroke: rgb(0 109 115 / 0.8); }
    .badge-b { fill: rgb(136 57 239 / 0.12);  stroke: rgb(128 46 229 / 0.8); }

    .t-ttl  { font-size: 13px;   font-weight: 600; fill: #4c4f69; }
    .t-sub  { font-size: 11px;   fill: #5c5f77; }
    .t-lab  { font-size: 11px;   fill: #5c5f77; }
    .t-step { font-size: 12px;   font-weight: 700; letter-spacing: 1px; }
    .t-num  { font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    .t-mid  { text-anchor: middle; }

    .f-n { fill: #5c5f77; }
    .f-d { fill: #ab3f00; }
    .f-c { fill: #006d73; }
    .f-b { fill: #802ee5; }

    .arw  { stroke-width: 1.5; fill: none; }
    .s-n  { stroke: #5c5f77; }
    .s-d  { stroke: #ab3f00; }
    .s-c  { stroke: #006d73; }
    .s-b  { stroke: #802ee5; }
    .dash { stroke-dasharray: 5 4; }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1e1e2e; stroke: #6c7086; }
      .panel  { fill: #181825; stroke: #45475a; }

      .blk   { fill: #313244; }
      .blk-d { stroke: rgb(250 179 135 / 0.7); }
      .blk-c { stroke: rgb(148 226 213 / 0.7); }
      .blk-b { stroke: rgb(203 166 247 / 0.7); }

      .hd-d { fill: #5d4e53; }
      .hd-c { fill: #475964; }
      .hd-b { fill: #534c6b; }

      .badge-d { fill: rgb(250 179 135 / 0.18);  stroke: rgb(250 179 135 / 0.8); }
      .badge-c { fill: rgb(148 226 213 / 0.18); stroke: rgb(148 226 213 / 0.8); }
      .badge-b { fill: rgb(203 166 247 / 0.18); stroke: rgb(203 166 247 / 0.8); }

      .t-ttl { fill: #cdd6f4; }
      .t-sub { fill: #a6adc8; }
      .t-lab { fill: #a6adc8; }

      .f-n { fill: #a6adc8; }
      .f-d { fill: #fab387; }
      .f-c { fill: #94e2d5; }
      .f-b { fill: #cba6f7; }

      .s-n { stroke: #a6adc8; }
      .s-d { stroke: #fab387; }
      .s-c { stroke: #94e2d5; }
      .s-b { stroke: #cba6f7; }
    }
  </style>

  <rect class="canvas" x="0.5" y="0.5" width="659" height="235" rx="14"/>

  <rect class="panel dash" x="250" y="30" width="396" height="158" rx="12"/>
  <text class="t-step f-b" x="268" y="54">PROCESSOR COMPONENT</text>

  <g>
    <rect class="blk blk-d" x="16" y="78" width="150" height="84" rx="8"/>
    <rect class="hd-d" x="16" y="78" width="150" height="22" rx="8"/>
    <rect class="hd-d" x="16" y="92" width="150" height="8"/>
    <text class="t-ttl" x="28" y="94">Host</text>
    <text class="t-sub" x="28" y="118">saci-service</text>
    <text class="t-sub" x="28" y="134">marshals the batch</text>
    <text class="t-sub" x="28" y="150">as Arrow IPC</text>
  </g>

  <g>
    <rect class="blk blk-b" x="268" y="78" width="176" height="84" rx="8"/>
    <rect class="hd-b" x="268" y="78" width="176" height="22" rx="8"/>
    <rect class="hd-b" x="268" y="92" width="176" height="8"/>
    <text class="t-ttl" x="280" y="94">SDK codec</text>
    <text class="t-sub" x="280" y="118">decode, set, write</text>
    <text class="t-sub" x="280" y="134">Arrow IPC, standard</text>
    <text class="t-sub" x="280" y="150">library only</text>
  </g>

  <g>
    <rect class="blk blk-b" x="470" y="78" width="160" height="84" rx="8"/>
    <rect class="hd-b" x="470" y="78" width="160" height="22" rx="8"/>
    <rect class="hd-b" x="470" y="92" width="160" height="8"/>
    <text class="t-ttl" x="482" y="94">Your transforms</text>
    <text class="t-sub" x="482" y="118">typed rows in,</text>
    <text class="t-sub" x="482" y="134">mutated rows out</text>
  </g>

  <path class="arw s-b" d="M166 120 H266" marker-end="url(#m-b)"/>
  <text class="t-lab t-mid f-b" x="208" y="112">run-batch</text>
  <text class="t-lab t-mid f-b" x="208" y="140">ipc-bytes</text>

  <path class="arw s-d" d="M444 120 H468" marker-end="url(#m-d)"/>

  <path class="arw s-b" d="M356 162 V204 H91 V164" marker-end="url(#m-b)"/>
  <text class="t-lab t-mid f-b" x="224" y="221">run-result: ipc-bytes, checkpoint, metrics</text>

  <defs>
    <marker id="m-n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-n"/>
    </marker>
    <marker id="m-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-d"/>
    </marker>
    <marker id="m-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-b"/>
    </marker>
    <marker id="m-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-c"/>
    </marker>
  </defs>
</svg>
