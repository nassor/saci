    <rect class="hd-c" x="24" y="72" width="132" height="22" rx="8"/>
    <rect class="hd-c" x="24" y="86" width="132" height="8"/>
    <text class="t-ttl" x="36" y="88">Sources</text>
    <text class="t-sub" x="36" y="112">orders_kafka</text>
    <text class="t-sub" x="36" y="128">catalog_file</text>
  </g>
  <g>
    <rect class="blk blk-b" x="176" y="72" width="150" height="64" rx="8"/>
    <rect class="hd-b" x="176" y="72" width="150" height="22" rx="8"/>
    <rect class="hd-b" x="176" y="86" width="150" height="8"/>
    <text class="t-ttl" x="188" y="88">classify</text>
    <text class="t-sub" x="188" y="112">wasm</text>
    <text class="t-sub" x="188" y="128">join, derive, route</text>
  </g>
  <g>
    <rect class="blk blk-c" x="24" y="188" width="132" height="64" rx="8"/>
    <rect class="hd-c" x="24" y="188" width="132" height="22" rx="8"/>
    <rect class="hd-c" x="24" y="202" width="132" height="8"/>
    <text class="t-ttl" x="36" y="204">Source</text>
    <text class="t-sub" x="36" y="228">payments_nats</text>
    <text class="t-sub" x="36" y="244">JetStream</text>
  </g>
  <g>
    <rect class="blk blk-b" x="176" y="188" width="150" height="64" rx="8"/>
    <rect class="hd-b" x="176" y="188" width="150" height="22" rx="8"/>
    <rect class="hd-b" x="176" y="202" width="150" height="8"/>
