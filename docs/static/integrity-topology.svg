    <text class="t-sub" x="36" y="366">audit_cdc</text>
    <text class="t-sub" x="36" y="382">cdc_logical</text>
  </g>
  <g>
    <rect class="blk blk-b" x="176" y="326" width="150" height="64" rx="8"/>
    <rect class="hd-b" x="176" y="326" width="150" height="22" rx="8"/>
    <rect class="hd-b" x="176" y="340" width="150" height="8"/>
    <text class="t-ttl" x="188" y="342">verify_audit</text>
    <text class="t-sub" x="188" y="366">wasm, stateless</text>
    <text class="t-sub" x="188" y="382">verdict per change</text>
  </g>
  <g>
    <rect class="blk blk-d" x="474" y="72" width="170" height="318" rx="8"/>
    <rect class="hd-d" x="474" y="72" width="170" height="22" rx="8"/>
    <rect class="hd-d" x="474" y="86" width="170" height="8"/>
    <text class="t-ttl" x="486" y="88">integrity_check</text>
  </g>
    <text class="t-sub" x="486" y="114">POST /sink/express</text>
    <text class="t-sub" x="486" y="138">POST /sink/standard</text>
    <text class="t-sub" x="486" y="224">POST /sink/window</text>
    <text class="t-sub" x="486" y="362">POST /sink/audit</text>
    <text class="t-sub" x="486" y="290">also publishes the</text>
    <text class="t-sub" x="486" y="306">workload and verifies</text>
    <text class="t-sub" x="486" y="322">every row</text>
  <path class="arw s-d" d="M156 104 H168" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M156 220 H168" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M156 358 H168" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M326 110 H466" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M326 134 H466" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M326 220 H466" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M326 358 H466" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M251 136 V180" marker-end="url(#m-d)"/>
  <text class="t-lab t-mid f-d" x="396" y="104">ndjson</text>
  <text class="t-lab t-mid f-d" x="396" y="128">csv</text>
  <text class="t-lab t-mid f-d" x="396" y="214">arrow-ipc</text>
