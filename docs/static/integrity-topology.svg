    <text class="t-sub" x="188" y="228">wasm, windowed</text>
    <text class="t-sub" x="188" y="244">10s tumbling</text>
  </g>
  <g>
    <rect class="blk blk-c" x="24" y="326" width="132" height="64" rx="8"/>
    <rect class="hd-c" x="24" y="326" width="132" height="22" rx="8"/>
    <rect class="hd-c" x="24" y="340" width="132" height="8"/>
