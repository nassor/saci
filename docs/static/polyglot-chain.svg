<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 388" role="img" aria-labelledby="pg-chain-title pg-chain-desc">
  <title id="pg-chain-title">Six WebAssembly components in six languages, driven by one host</title>
  <desc id="pg-chain-desc">
    A host box at the top, polyglot_orders, loads six components and runs them in order over one Order dataset. Row one, left to right: stage 1 validate-go in Go writes valid; stage 2 enrich-py in Python writes usd_amount and usd_amount_display; stage 3 score-ts in TypeScript writes risk_score and flagged. The chain wraps to row two, right to left: stage 4 fee-kt in Kotlin writes fee; stage 5 tier-cs in C# writes review_tier; stage 6 settle-rs in Rust writes settlement and keeps a ledger. The host feeds the ledger checkpoint from batch 1 back into the Rust stage for batch 2.
  </desc>

  <style>
    text { font-family: 'Fira Code', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }

    /* Catppuccin Latte, with Mocha below for a dark viewer. Site CSS does not
       reach a standalone figure, so both flavours live here. An accent tints
       an area; the darker ink tone draws lines and sets letters, which is
       what Latte needs to hold 4.5:1 and 3:1. */
    .canvas { fill: #eff1f5; stroke: #7c7f93; }
    .panel  { fill: #e6e9ef; stroke: #acb0be; }

    .blk   { fill: #eff1f5; stroke-width: 1; }
    .blk-d { stroke: rgb(171 63 0 / 0.7); }
    .blk-c { stroke: rgb(0 109 115 / 0.7); }
    .blk-b { stroke: rgb(128 46 229 / 0.7); }

    .hd-d { fill: #f2d2c2; }
    .hd-c { fill: #bfdce1; }
    .hd-b { fill: #d8c9f4; }

    /* The badges sit on the panel, not on the canvas, so the wash under the
       step number is thinner than the one the site uses on the page. */
    .badge   { stroke-width: 1; }
    .badge-d { fill: rgb(254 100 11 / 0.12);  stroke: rgb(171 63 0 / 0.8); }
    .badge-c { fill: rgb(23 146 153 / 0.12);  stroke: rgb(0 109 115 / 0.8); }
    .badge-b { fill: rgb(136 57 239 / 0.12);  stroke: rgb(128 46 229 / 0.8); }

    .t-ttl  { font-size: 13px;   font-weight: 600; fill: #4c4f69; }
    .t-sub  { font-size: 11px;   fill: #5c5f77; }
    .t-lab  { font-size: 11px;   fill: #5c5f77; }
    .t-step { font-size: 12px;   font-weight: 700; letter-spacing: 1px; }
    .t-num  { font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    .t-mid  { text-anchor: middle; }

    .f-n { fill: #5c5f77; }
    .f-d { fill: #ab3f00; }
    .f-c { fill: #006d73; }
    .f-b { fill: #802ee5; }

    .arw  { stroke-width: 1.5; fill: none; }
    .s-n  { stroke: #5c5f77; }
    .s-d  { stroke: #ab3f00; }
    .s-c  { stroke: #006d73; }
    .s-b  { stroke: #802ee5; }
    .dash { stroke-dasharray: 5 4; }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1e1e2e; stroke: #6c7086; }
      .panel  { fill: #181825; stroke: #45475a; }

      .blk   { fill: #313244; }
      .blk-d { stroke: rgb(250 179 135 / 0.7); }
      .blk-c { stroke: rgb(148 226 213 / 0.7); }
      .blk-b { stroke: rgb(203 166 247 / 0.7); }

      .hd-d { fill: #5d4e53; }
      .hd-c { fill: #475964; }
      .hd-b { fill: #534c6b; }

      .badge-d { fill: rgb(250 179 135 / 0.18);  stroke: rgb(250 179 135 / 0.8); }
      .badge-c { fill: rgb(148 226 213 / 0.18); stroke: rgb(148 226 213 / 0.8); }
      .badge-b { fill: rgb(203 166 247 / 0.18); stroke: rgb(203 166 247 / 0.8); }

      .t-ttl { fill: #cdd6f4; }
      .t-sub { fill: #a6adc8; }
      .t-lab { fill: #a6adc8; }

      .f-n { fill: #a6adc8; }
      .f-d { fill: #fab387; }
      .f-c { fill: #94e2d5; }
      .f-b { fill: #cba6f7; }

      .s-n { stroke: #a6adc8; }
      .s-d { stroke: #fab387; }
      .s-c { stroke: #94e2d5; }
      .s-b { stroke: #cba6f7; }
    }
  </style>

  <rect class="canvas" x="0.5" y="0.5" width="659" height="387" rx="14"/>

  <g>
    <rect class="blk blk-c" x="24" y="24" width="612" height="64" rx="8"/>
    <rect class="hd-c" x="24" y="24" width="612" height="22" rx="8"/>
    <rect class="hd-c" x="24" y="38" width="612" height="8"/>
    <text class="t-ttl" x="36" y="40">Host: polyglot_orders</text>
    <text class="t-sub" x="36" y="64">WasmPipelineRuntime passes one Order dataset to each component in turn.</text>
    <text class="t-sub" x="36" y="80">The Rust stage returns a ledger checkpoint that batch 2 feeds back as prior.</text>
  </g>
  <path class="arw s-c" d="M118 88 V124" marker-end="url(#m-c)"/>
  <text class="t-lab f-c" x="130" y="110">calls stage 1, then 2 to 6</text>

  <g>
    <rect class="blk blk-b" x="24" y="124" width="188" height="88" rx="8"/>
    <rect class="hd-b" x="24" y="124" width="188" height="22" rx="8"/>
    <rect class="hd-b" x="24" y="138" width="188" height="8"/>
    <text class="t-ttl" x="36" y="140">1 validate-go</text>
    <text class="t-sub" x="36" y="164">Go</text>
    <text class="t-sub" x="36" y="180">writes valid</text>
  </g>
  <g>
    <rect class="blk blk-b" x="236" y="124" width="188" height="88" rx="8"/>
    <rect class="hd-b" x="236" y="124" width="188" height="22" rx="8"/>
    <rect class="hd-b" x="236" y="138" width="188" height="8"/>
    <text class="t-ttl" x="248" y="140">2 enrich-py</text>
    <text class="t-sub" x="248" y="164">Python</text>
    <text class="t-sub" x="248" y="180">writes usd_amount,</text>
    <text class="t-sub" x="248" y="196">usd_amount_display</text>
  </g>
  <g>
    <rect class="blk blk-b" x="448" y="124" width="188" height="88" rx="8"/>
    <rect class="hd-b" x="448" y="124" width="188" height="22" rx="8"/>
    <rect class="hd-b" x="448" y="138" width="188" height="8"/>
    <text class="t-ttl" x="460" y="140">3 score-ts</text>
    <text class="t-sub" x="460" y="164">TypeScript</text>
    <text class="t-sub" x="460" y="180">writes risk_score,</text>
    <text class="t-sub" x="460" y="196">flagged</text>
  </g>
  <g>
    <rect class="blk blk-b" x="448" y="248" width="188" height="88" rx="8"/>
    <rect class="hd-b" x="448" y="248" width="188" height="22" rx="8"/>
    <rect class="hd-b" x="448" y="262" width="188" height="8"/>
    <text class="t-ttl" x="460" y="264">4 fee-kt</text>
    <text class="t-sub" x="460" y="288">Kotlin</text>
    <text class="t-sub" x="460" y="304">writes fee</text>
  </g>
  <g>
    <rect class="blk blk-b" x="236" y="248" width="188" height="88" rx="8"/>
    <rect class="hd-b" x="236" y="248" width="188" height="22" rx="8"/>
    <rect class="hd-b" x="236" y="262" width="188" height="8"/>
    <text class="t-ttl" x="248" y="264">5 tier-cs</text>
    <text class="t-sub" x="248" y="288">C#</text>
    <text class="t-sub" x="248" y="304">writes review_tier</text>
  </g>
  <g>
    <rect class="blk blk-b" x="24" y="248" width="188" height="88" rx="8"/>
    <rect class="hd-b" x="24" y="248" width="188" height="22" rx="8"/>
    <rect class="hd-b" x="24" y="262" width="188" height="8"/>
    <text class="t-ttl" x="36" y="264">6 settle-rs</text>
    <text class="t-sub" x="36" y="288">Rust</text>
    <text class="t-sub" x="36" y="304">writes settlement,</text>
    <text class="t-sub" x="36" y="320">keeps the ledger</text>
  </g>
  <path class="arw s-d" d="M212 168 H234" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M424 168 H446" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M542 212 V246" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M448 292 H426" marker-end="url(#m-d)"/>
  <path class="arw s-d" d="M236 292 H214" marker-end="url(#m-d)"/>
  <text class="t-lab t-mid" x="330" y="366">Arrows carry the same twelve-field Order dataset. Each stage fills its own columns.</text>

  <defs>
    <marker id="m-n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-n"/>
    </marker>
    <marker id="m-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-d"/>
    </marker>
    <marker id="m-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-b"/>
    </marker>
    <marker id="m-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-c"/>
    </marker>
  </defs>
</svg>
