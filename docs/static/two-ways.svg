<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" role="img" aria-labelledby="tw-title tw-desc">
  <title id="tw-title">Two ways to use SACI: as a library or as a server</title>
  <desc id="tw-desc">
    As a library, cargo add saci puts the engine in your own Rust binary: you own main, build a
    Pipeline from your Components and Systems, and call pipeline.run(). As a server, cargo install
    saci --features server gives the saci-service binary: it reads saci.kdl, moves Arrow batches
    from sources to sinks, and loads your Pipeline at runtime as a WebAssembly component or a
    native plugin. Both run the same engine: Dataset, System, Pipeline and the stage plan derived
    from field declarations.
  </desc>

  <style>
    text { font-family: 'Fira Code', ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; }

    /* Catppuccin Latte, with Mocha below for a dark viewer. Site CSS does not
       reach a standalone figure, so both flavours live here. An accent tints
       an area; the darker ink tone draws lines and sets letters, which is
       what Latte needs to hold 4.5:1 and 3:1. */
    .canvas { fill: #eff1f5; stroke: #7c7f93; }
    .panel  { fill: #e6e9ef; stroke: #acb0be; }

    .blk   { fill: #eff1f5; stroke-width: 1; }
    .blk-d { stroke: rgb(171 63 0 / 0.7); }
    .blk-c { stroke: rgb(0 109 115 / 0.7); }
    .blk-b { stroke: rgb(128 46 229 / 0.7); }

    .hd-d { fill: #f2d2c2; }
    .hd-c { fill: #bfdce1; }
    .hd-b { fill: #d8c9f4; }

    /* The badges sit on the panel, not on the canvas, so the wash under the
       step number is thinner than the one the site uses on the page. */
    .badge   { stroke-width: 1; }
    .badge-d { fill: rgb(254 100 11 / 0.12);  stroke: rgb(171 63 0 / 0.8); }
    .badge-c { fill: rgb(23 146 153 / 0.12);  stroke: rgb(0 109 115 / 0.8); }
    .badge-b { fill: rgb(136 57 239 / 0.12);  stroke: rgb(128 46 229 / 0.8); }

    .t-ttl  { font-size: 13px;   font-weight: 600; fill: #4c4f69; }
    .t-sub  { font-size: 11px;   fill: #5c5f77; }
    .t-lab  { font-size: 11px;   fill: #5c5f77; }
    .t-step { font-size: 12px;   font-weight: 700; letter-spacing: 1px; }
    .t-num  { font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    .t-mid  { text-anchor: middle; }

    .f-n { fill: #5c5f77; }
    .f-d { fill: #ab3f00; }
    .f-c { fill: #006d73; }
    .f-b { fill: #802ee5; }

    .arw  { stroke-width: 1.5; fill: none; }
    .s-n  { stroke: #5c5f77; }
    .s-d  { stroke: #ab3f00; }
    .s-c  { stroke: #006d73; }
    .s-b  { stroke: #802ee5; }
    .dash { stroke-dasharray: 5 4; }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1e1e2e; stroke: #6c7086; }
      .panel  { fill: #181825; stroke: #45475a; }

      .blk   { fill: #313244; }
      .blk-d { stroke: rgb(250 179 135 / 0.7); }
      .blk-c { stroke: rgb(148 226 213 / 0.7); }
      .blk-b { stroke: rgb(203 166 247 / 0.7); }

      .hd-d { fill: #5d4e53; }
      .hd-c { fill: #475964; }
      .hd-b { fill: #534c6b; }

      .badge-d { fill: rgb(250 179 135 / 0.18);  stroke: rgb(250 179 135 / 0.8); }
      .badge-c { fill: rgb(148 226 213 / 0.18); stroke: rgb(148 226 213 / 0.8); }
      .badge-b { fill: rgb(203 166 247 / 0.18); stroke: rgb(203 166 247 / 0.8); }

      .t-ttl { fill: #cdd6f4; }
      .t-sub { fill: #a6adc8; }
      .t-lab { fill: #a6adc8; }

      .f-n { fill: #a6adc8; }
      .f-d { fill: #fab387; }
      .f-c { fill: #94e2d5; }
      .f-b { fill: #cba6f7; }

      .s-n { stroke: #a6adc8; }
      .s-d { stroke: #fab387; }
      .s-c { stroke: #94e2d5; }
      .s-b { stroke: #cba6f7; }
    }
  </style>

  <rect class="canvas" x="0.5" y="0.5" width="659" height="343" rx="14"/>

  <!-- library -->
  <rect class="panel" x="20" y="20" width="300" height="236" rx="12"/>
  <text class="t-step f-d" x="38" y="50">AS A LIBRARY</text>
  <text class="t-lab" x="38" y="70">cargo add saci</text>
  <g>
    <rect class="blk blk-c" x="40" y="86" width="260" height="64" rx="8"/>
    <rect class="hd-c" x="40" y="86" width="260" height="22" rx="8"/>
    <rect class="hd-c" x="40" y="100" width="260" height="8"/>
    <text class="t-ttl" x="52" y="102">your Rust binary</text>
    <text class="t-sub" x="52" y="126">owns main and calls pipeline.run()</text>
  </g>
  <path class="arw s-n" d="M170 150 V172" marker-end="url(#m-n)"/>
  <g>
    <rect class="blk blk-d" x="40" y="178" width="260" height="64" rx="8"/>
    <rect class="hd-d" x="40" y="178" width="260" height="22" rx="8"/>
    <rect class="hd-d" x="40" y="192" width="260" height="8"/>
    <text class="t-ttl" x="52" y="194">Pipeline</text>
    <text class="t-sub" x="52" y="218">your Components and Systems,</text>
    <text class="t-sub" x="52" y="234">compiled into the binary</text>
  </g>

  <!-- server -->
  <rect class="panel" x="340" y="20" width="300" height="236" rx="12"/>
  <text class="t-step f-c" x="358" y="50">AS A SERVER</text>
  <text class="t-lab" x="358" y="70">cargo install saci --features server</text>
  <g>
    <rect class="blk blk-c" x="360" y="86" width="260" height="64" rx="8"/>
    <rect class="hd-c" x="360" y="86" width="260" height="22" rx="8"/>
    <rect class="hd-c" x="360" y="100" width="260" height="8"/>
    <text class="t-ttl" x="372" y="102">saci-service</text>
    <text class="t-sub" x="372" y="126">reads saci.kdl, moves Arrow</text>
    <text class="t-sub" x="372" y="142">batches from sources to sinks</text>
  </g>
  <path class="arw s-b dash" d="M490 150 V172" marker-end="url(#m-b)"/>
  <text class="t-lab f-b" x="500" y="166">loads at runtime</text>
  <g>
    <rect class="blk blk-b" x="360" y="178" width="260" height="64" rx="8"/>
    <rect class="hd-b" x="360" y="178" width="260" height="22" rx="8"/>
    <rect class="hd-b" x="360" y="192" width="260" height="8"/>
    <text class="t-ttl" x="372" y="194">processor</text>
    <text class="t-sub" x="372" y="218">your Pipeline as a .wasm</text>
    <text class="t-sub" x="372" y="234">component or a native plugin</text>
  </g>

  <!-- shared engine -->
  <path class="arw s-n" d="M170 242 V282" marker-end="url(#m-n)"/>
  <path class="arw s-n" d="M490 242 V282" marker-end="url(#m-n)"/>
  <rect class="panel" x="20" y="288" width="620" height="40" rx="10"/>
  <text class="t-ttl t-mid" x="330" y="313">same engine: Dataset, System, Pipeline, field-derived stage plan</text>

  <defs>
    <marker id="m-n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-n"/>
    </marker>
    <marker id="m-d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-d"/>
    </marker>
    <marker id="m-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-b"/>
    </marker>
    <marker id="m-c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" class="f-c"/>
    </marker>
  </defs>
</svg>
